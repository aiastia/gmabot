<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 网格生存战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>⚔ 2D 网格生存战 ⚔</h1>
        <div class="subtitle">8 位 AI 战士 · 最后存活者获胜 · 纯本地运行</div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <span class="legend-dot" style="background:#e94560;"></span> 食物
        </div>
        <div class="legend-item">
            <span class="legend-diamond" style="background:#8B4513;"></span> 木棍 (+5)
        </div>
        <div class="legend-item">
            <span class="legend-diamond" style="background:#C0C0C0;"></span> 铁剑 (+12)
        </div>
        <div class="legend-item">
            <span class="legend-diamond" style="background:#FFD700;"></span> 神剑 (+25)
        </div>
        <div class="legend-item">
            <span style="font-size:14px;">💀</span> 死亡位置
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-bar">
        <div class="control-item"><kbd>空格</kbd> 暂停/继续 / 跳过倒计时</div>
        <div class="control-item"><kbd>R</kbd> 重新开始</div>
        <div class="control-item"><kbd>1-5</kbd> 速度调节</div>
        <div class="control-item">
            <button id="btnRestart" onclick="window.gameInstance && window.gameInstance.restart()" style="
                background: #FFD700; color: #1a1a2e; border: none; padding: 4px 14px;
                border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;
            ">🔄 重新开始</button>
        </div>
        <div class="control-item">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#e0e0e0;font-size:13px;">
                <input type="checkbox" id="autoRestartToggle" onchange="window.gameInstance && window.gameInstance.setAutoRestart(this.checked)" style="width:16px;height:16px;accent-color:#FFD700;cursor:pointer;">
                🔁 自动连战
            </label>
        </div>
    </div>

    <!-- 脚本按依赖顺序加载 -->
    <script src="js/config.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/item.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
